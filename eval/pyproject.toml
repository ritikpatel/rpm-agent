[project]
name = "rpm-eval"
version = "0.4.0"
description = "Evaluation harness: deterministic offline replay (alarm burden, sensitivity, time-to-detect, PPV) and live-stack chaos/load experiments"
requires-python = ">=3.12"
dependencies = ["rpm-contracts", "rpm-features", "rpm-mimic", "rpm-common", "rpm-simulator", "rpm-icu-gateway",
                "stream-engine", "agent-service", "rpm-rag", "httpx>=0.27", "paho-mqtt>=2.1", "psycopg[binary]>=3.2"]

[project.scripts]
rpm-eval = "rpm_eval.cli:main"

[tool.uv.sources]
rpm-contracts = { workspace = true }
rpm-features = { workspace = true }
rpm-mimic = { workspace = true }
rpm-common = { workspace = true }
rpm-simulator = { workspace = true }
rpm-icu-gateway = { workspace = true }
stream-engine = { workspace = true }
agent-service = { workspace = true }
rpm-rag = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
