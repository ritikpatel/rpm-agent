[project]
name = "rpm-platform"
version = "0.2.0"
description = "Agentic AI remote patient monitoring platform (workspace root)"
requires-python = ">=3.12"
dependencies = [
    "rpm-core",
    "stream-processor",
    "risk-service",
    "care-api",
    "agent-service",
    "rpm-simulator",
    "rpm-seed",
    "iot-rule-emulator",
    "rpm-eval",
]

[dependency-groups]
dev = ["pytest>=8.3", "jsonschema>=4.23", "ruff>=0.6", "httpx>=0.27"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*", "simulator", "tools/*"]

[tool.uv.sources]
rpm-core = { workspace = true }
stream-processor = { workspace = true }
risk-service = { workspace = true }
care-api = { workspace = true }
agent-service = { workspace = true }
rpm-simulator = { workspace = true }
rpm-seed = { workspace = true }
iot-rule-emulator = { workspace = true }
rpm-eval = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["libs", "services", "simulator", "contracts", "tools", "models"]
addopts = "-q --import-mode=importlib"
log_level = "DEBUG"  # execute every log call in tests (catches LogRecord key collisions)

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["rpm_core", "rpm_simulator", "stream_processor", "risk_service", "care_api", "agent_service",
                     "rpm_seed", "iot_rule_emulator", "rpm_eval"]
