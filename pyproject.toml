[project]
name = "rpm-platform"
version = "0.1.0"
description = "Agentic AI Remote Patient Monitoring platform (workspace root)"
requires-python = ">=3.12"
dependencies = [
    "rpm-contracts",
    "rpm-features",
    "rpm-mimic",
    "rpm-common",
    "rpm-simulator",
    "iot-bridge",
    "stream-engine",
    "fhir-loader",
    "rpm-api",
]

[dependency-groups]
dev = ["pytest>=8.3", "jsonschema>=4.23", "ruff>=0.6", "httpx>=0.27"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*", "simulator"]

[tool.uv.sources]
rpm-contracts = { workspace = true }
rpm-features = { workspace = true }
rpm-mimic = { workspace = true }
rpm-common = { workspace = true }
rpm-simulator = { workspace = true }
iot-bridge = { workspace = true }
stream-engine = { workspace = true }
fhir-loader = { workspace = true }
rpm-api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["libs", "services", "simulator", "contracts"]
addopts = "-q --import-mode=importlib"
log_level = "DEBUG"  # execute every log call in tests (catches LogRecord key collisions)

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["rpm_contracts", "rpm_features", "rpm_mimic", "rpm_common", "rpm_simulator", "stream_engine",
                     "fhir_loader", "iot_bridge", "rpm_api"]
