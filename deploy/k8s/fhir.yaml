# HAPI FHIR R4: the hospital record. Reachable only inside the cluster (it has no sign-in of its own); rest-hook
# subscriptions notify care-api of admissions, discharges and lab results.
apiVersion: v1
kind: Service
metadata: {name: fhir}
spec:
  selector: {app: fhir}
  ports: [{port: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: fhir, labels: {app: fhir}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: fhir}}
  template:
    metadata: {labels: {app: fhir, rpm/db: client, rpm/aws: none}}
    spec:
      containers:
        - name: fhir
          image: hapiproject/hapi:v8.12.0-1
          env:
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/hapi"}
            - {name: SPRING_DATASOURCE_USERNAME, value: rpm}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: rpm-secrets, key: POSTGRES_PASSWORD}}
            - {name: SPRING_DATASOURCE_DRIVERCLASSNAME, value: org.postgresql.Driver}
            - {name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT, value: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect}
            - {name: SPRING_JPA_PROPERTIES_HIBERNATE_SEARCH_ENABLED, value: "false"}
            - {name: HAPI_FHIR_FHIR_VERSION, value: R4}
            - {name: HAPI_FHIR_CR_ENABLED, value: "false"}
            - {name: HAPI_FHIR_SUBSCRIPTION_RESTHOOK_ENABLED, value: "true"}
            - {name: JAVA_TOOL_OPTIONS, value: "-Xms256m -Xmx1024m -XX:+UseSerialGC"}
          ports: [{containerPort: 8080}]
          startupProbe:              # the first start creates its schema and takes a minute or two
            httpGet: {path: /fhir/metadata, port: 8080}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /fhir/metadata, port: 8080}
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 768Mi}
            limits: {memory: 1600Mi}
