# PostgreSQL with pgvector: the operational store, the guideline index and the FHIR server's database.
# Data lives on a persistent volume on the instance's encrypted disk, so it survives restarts and stop/start.
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, labels: {app: postgres}}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres, rpm/aws: none}}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.6-pg16
          env:
            - {name: POSTGRES_USER, value: rpm}
            - {name: POSTGRES_DB, value: rpm}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: rpm-secrets, key: POSTGRES_PASSWORD}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, rpm, -d, rpm]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -U, rpm, -d, rpm]}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: init
          configMap: {name: postgres-init}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: {requests: {storage: 10Gi}}
