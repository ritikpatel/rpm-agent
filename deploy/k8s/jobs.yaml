# Scheduled and on-demand jobs.
#
# `seed` never runs on its schedule (suspend: true): it is a template that `make cloud-seed` starts with
# `kubectl create job --from=cronjob/seed`, so it always uses the current image and settings.
apiVersion: batch/v1
kind: CronJob
metadata: {name: seed}
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1500
      ttlSecondsAfterFinished: 86400
      template:
        metadata: {labels: {app: seed, rpm/db: client, rpm/fhir: client}}
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: ecr}]
          securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
          containers:
            - name: seed
              image: rpm/platform
              command: [rpm-seed, all]    # training data and protocols come from S3 (RPM_DATA_DIR, RPM_PROTOCOLS_DIR)
              envFrom:
                - configMapRef: {name: rpm-config}
                - secretRef: {name: rpm-secrets}
              resources:
                requests: {cpu: 100m, memory: 192Mi}
                limits: {memory: 768Mi}
---
# Hourly: new audit-log rows to the audit bucket as FHIR AuditEvent, each batch hash-chained to the one before.
apiVersion: batch/v1
kind: CronJob
metadata: {name: audit-export}
spec:
  schedule: "7 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 7200
      template:
        metadata: {labels: {app: audit-export, rpm/db: client}}
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: ecr}]
          securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
          containers:
            - name: audit-export
              image: rpm/platform
              command: [rpm-audit-export, --dest, $(DEST)]
              envFrom:
                - configMapRef: {name: rpm-config}
                - secretRef: {name: rpm-secrets}
              env:
                - name: DEST
                  valueFrom: {configMapKeyRef: {name: rpm-config, key: RPM_AUDIT_DEST}}
              resources:
                requests: {cpu: 20m, memory: 96Mi}
                limits: {memory: 256Mi}
---
# Daily (06:00 India time): the daily-trigger models, such as recovery monitoring, for every patient at home.
apiVersion: batch/v1
kind: CronJob
metadata: {name: daily-score}
spec:
  schedule: "30 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 7200
      template:
        metadata: {labels: {app: daily-score, rpm/risk: client}}
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: ecr}]
          securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
          containers:
            - name: daily-score
              image: rpm/platform
              command:
                - python
                - -c
                - |
                  import os, urllib.request as u
                  r = u.Request(os.environ["RPM_RISK_SERVICE_URL"] + "/v1/score/daily", method="POST",
                                headers={"X-Service-Token": os.environ["RPM_SERVICE_TOKEN"]})
                  print(u.urlopen(r, timeout=600).read().decode())
              envFrom:
                - configMapRef: {name: rpm-config}
                - secretRef: {name: rpm-secrets}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 128Mi}
