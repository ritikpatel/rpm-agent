# The only way in: k3s's built-in ingress (Traefik) on port 80 sends everything to the console, which serves the
# application and proxies /api and /ws to care-api. The security group admits only CloudFront's addresses, and this
# rule also requires the header that our CloudFront distribution adds, so another distribution cannot front it.
# __ORIGIN_SECRET__ is filled in on the instance from Parameter Store; it is never in git.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: console}
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: PathPrefix(`/`) && Header(`X-Origin-Verify`, `__ORIGIN_SECRET__`)
      services:
        - {name: console, port: 8080}
