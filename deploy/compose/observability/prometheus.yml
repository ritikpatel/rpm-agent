# Local stack: scrape every service's /metrics. On EKS the same metrics are scraped via the chart's PodMonitor.
global:
  scrape_interval: 5s
  evaluation_interval: 15s
scrape_configs:
  - job_name: rpm
    static_configs:
      - targets: ["stream-engine:9101"]
        labels: { service: stream-engine }
      - targets: ["iot-bridge:9102"]
        labels: { service: iot-bridge }
      - targets: ["alert-service:9103"]
        labels: { service: alert-service }
      - targets: ["agent-service:9104"]
        labels: { service: agent-service }
      - targets: ["telemetry-archiver:9105"]
        labels: { service: telemetry-archiver }
      - targets: ["icu-gateway:9110"]
        labels: { service: icu-gateway }
