# Local stack: the same containers that run on AWS, with open-source stand-ins for the managed services
#   AWS IoT Core -> Mosquitto + iot-rule-emulator      Amazon SQS -> ElasticMQ      Amazon SES -> Mailpit
#   Amazon Bedrock -> the real service when AWS credentials are present (make up LLM=bedrock), else offline rules
name: rpm

x-env: &env
  RPM_ENV: local
  RPM_LOG_LEVEL: ${RPM_LOG_LEVEL:-INFO}
  RPM_DATABASE_URL: postgresql://rpm:rpm@postgres:5432/rpm
  RPM_AWS_REGION: ap-southeast-2
  RPM_SQS_ENDPOINT: http://sqs:9324
  RPM_FHIR_BASE_URL: http://fhir:8080/fhir
  RPM_CARE_API_URL: http://care-api:8000
  RPM_RISK_SERVICE_URL: http://risk-service:8001
  RPM_SERVICE_TOKEN: ${RPM_SERVICE_TOKEN:-dev-service-token}
  RPM_COHORT_ICU: ${RPM_COHORT_ICU:-6}
  RPM_COHORT_HOME: ${RPM_COHORT_HOME:-18}
  # ElasticMQ accepts any credentials; real ones (exported by `make up LLM=bedrock`) are only used for Bedrock
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

x-platform: &platform
  image: rpm/platform:dev
  build: { context: ../.., dockerfile: deploy/docker/python.Dockerfile }
  restart: unless-stopped

services:
  # ------------------------------------------------------------------ stand-ins for managed services
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment: { POSTGRES_USER: rpm, POSTGRES_PASSWORD: rpm, POSTGRES_DB: rpm }
    volumes:
      - db:/var/lib/postgresql/data
      - ./postgres/01-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    ports: ["${RPM_PG_PORT:-5432}:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U rpm -d rpm"], interval: 3s, retries: 30 }
    mem_limit: 512m

  mosquitto:
    image: eclipse-mosquitto:2
    volumes: ["./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro",
              "../../.secrets/dev-pki/mosquitto:/mosquitto/config/conf.d:ro", "mqtt:/mosquitto/data"]
    ports: ["${RPM_MQTT_PORT:-1883}:1883", "${RPM_MQTTS_PORT:-8883}:8883"]
    mem_limit: 128m

  sqs:
    image: softwaremill/elasticmq-native:1.7.1
    volumes: ["./elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro"]
    ports: ["${RPM_SQS_PORT:-9324}:9324"]
    mem_limit: 256m

  mailpit:  # alert e-mails are viewable at http://localhost:8025 (Amazon SES on AWS)
    image: axllent/mailpit:v1.31
    ports: ["${RPM_MAILPIT_UI_PORT:-8025}:8025"]
    mem_limit: 128m

  fhir:  # the hospital record (same image on AWS); rest-hook subscriptions notify care-api of changes
    image: hapiproject/hapi:v8.12.0-1
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hapi
      SPRING_DATASOURCE_USERNAME: rpm
      SPRING_DATASOURCE_PASSWORD: rpm
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_SEARCH_ENABLED: "false"
      HAPI_FHIR_FHIR_VERSION: R4
      HAPI_FHIR_CR_ENABLED: "false"
      HAPI_FHIR_SUBSCRIPTION_RESTHOOK_ENABLED: "true"
      HAPI_FHIR_TESTER_HOME_NAME: RPM local FHIR
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx768m -XX:+UseSerialGC
    ports: ["${RPM_FHIR_PORT:-8080}:8080"]
    mem_limit: 1200m

  iot-rule-emulator:  # LOCAL ONLY: MQTT -> patient-events queue, as the AWS IoT topic rule does
    <<: *platform
    command: ["iot-rule-emulator"]
    environment: { <<: *env, RPM_MQTT_HOST: mosquitto }
    depends_on: [mosquitto, sqs]
    mem_limit: 128m

  # ------------------------------------------------------------------ the platform
  care-api:
    <<: *platform
    command: ["care-api"]
    environment:
      <<: *env
      RPM_AUTH_MODE: dev            # local only: care-api mints tokens; same verification and roles as Cognito
      RPM_MQTT_HOST: mosquitto
      RPM_EMAIL_BACKEND: smtp
      RPM_SMTP_HOST: mailpit
      RPM_CONSOLE_URL: http://localhost:${RPM_CONSOLE_PORT:-3000}
      RPM_ESCALATION_TIMEOUT_SCALE: "${RPM_ESCALATION_TIMEOUT_SCALE:-0.2}"   # demo: 5 minutes -> 1 minute
      RPM_EMBEDDINGS: ${RPM_EMBEDDINGS:-hash}
    ports: ["${RPM_API_PORT:-8000}:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      sqs: { condition: service_started }
      mailpit: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      retries: 30
    mem_limit: 384m

  stream-processor:
    <<: *platform
    command: ["stream-processor"]
    environment: { <<: *env, RPM_RUN_MIGRATIONS: "false" }
    depends_on:
      care-api: { condition: service_healthy }
      sqs: { condition: service_started }
    mem_limit: 256m

  risk-service:
    <<: *platform
    command: ["risk-service"]
    environment: { <<: *env, RPM_MODELS_URI: /models }
    volumes: ["../../models/plugins:/models:ro"]
    ports: ["${RPM_RISK_PORT:-8001}:8001"]
    depends_on: { care-api: { condition: service_healthy } }
    mem_limit: 512m

  agent-service:
    <<: *platform
    command: ["agent-service"]
    environment:
      <<: *env
      RPM_LLM_PROVIDER: ${RPM_LLM_PROVIDER:-offline}        # offline | bedrock
      RPM_MODEL_FAST: ${RPM_MODEL_FAST:-au.anthropic.claude-haiku-4-5-20251001-v1:0}
      RPM_MODEL_REASONING: ${RPM_MODEL_REASONING:-au.anthropic.claude-sonnet-4-6}
    depends_on:
      care-api: { condition: service_healthy }
      sqs: { condition: service_started }
    mem_limit: 384m

  console:
    build: { context: ../.., dockerfile: deploy/docker/console.Dockerfile }
    image: rpm/console:dev
    ports: ["${RPM_CONSOLE_PORT:-3000}:8080"]
    depends_on: [care-api]
    restart: unless-stopped
    mem_limit: 64m

  # ------------------------------------------------------------------ tools (profiles)
  seed:
    <<: *platform
    profiles: ["seed"]
    command: ["rpm-seed", "all"]
    environment: { <<: *env, RPM_MIMIC_DIR: /data/mimic, RPM_PROTOCOLS_DIR: /knowledge/protocols,
                   RPM_EMBEDDINGS: "${RPM_EMBEDDINGS:-hash}" }
    volumes: ["../../synthetic_mimic_150patients:/data/mimic:ro", "../../knowledge:/knowledge:ro"]
    depends_on:
      care-api: { condition: service_healthy }
      fhir: { condition: service_started }
    restart: "no"

  simulator:
    <<: *platform
    profiles: ["sim"]
    command: ["rpm-sim", "run"]
    environment:
      <<: *env
      RPM_MIMIC_DIR: /data/mimic
      RPM_MQTT_HOST: mosquitto
      RPM_SIM_AUTO_SCENARIOS: "${RPM_SIM_AUTO_SCENARIOS:-0}"
    volumes: ["../../synthetic_mimic_150patients:/data/mimic:ro"]
    depends_on: [mosquitto, care-api]
    mem_limit: 256m

volumes:
  db:      # new names: the previous architecture's volumes (rpm_pgdata, rpm_mqttdata) are left untouched
  mqtt:
