include classpath("application.conf")

node-address { protocol = http, host = sqs, port = 9324, context-path = "" }
rest-sqs { enabled = true, bind-port = 9324, bind-hostname = "0.0.0.0", sqs-limits = strict }
aws { region = ap-southeast-2, accountId = 000000000000 }

queues {
  # the unified stream: device telemetry and events (from the IoT rule) and EHR events (from the FHIR hook)
  rpm-patient-events {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 10 seconds
    deadLettersQueue { name = "rpm-patient-events-dlq", maxReceiveCount = 10 }
  }
  rpm-patient-events-dlq { }
  # work for the agents, queued by care-api
  rpm-agent-tasks {
    defaultVisibilityTimeout = 180 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "rpm-agent-tasks-dlq", maxReceiveCount = 3 }
  }
  rpm-agent-tasks-dlq { }
}
