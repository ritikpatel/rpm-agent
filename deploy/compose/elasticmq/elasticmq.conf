include classpath("application.conf")

node-address { protocol = http, host = sqs, port = 9324, context-path = "" }
rest-sqs { enabled = true, bind-port = 9324, bind-hostname = "0.0.0.0", sqs-limits = strict }
aws { region = ap-southeast-2, accountId = 000000000000 }

queues {
  # device ingest fan-out (the IoT rule's two SQS actions); visibility timeouts are shorter than on AWS so the
  # chaos experiments finish in minutes
  rpm-telemetry {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 10 seconds
    deadLettersQueue { name = "rpm-telemetry-dlq", maxReceiveCount = 10 }
  }
  rpm-telemetry-dlq { }
  rpm-telemetry-archive {
    defaultVisibilityTimeout = 90 seconds
    receiveMessageWait = 10 seconds
    deadLettersQueue { name = "rpm-telemetry-archive-dlq", maxReceiveCount = 10 }
  }
  rpm-telemetry-archive-dlq { }
  rpm-clinical-events {
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "rpm-clinical-events-dlq", maxReceiveCount = 5 }
  }
  rpm-clinical-events-dlq { }
  rpm-alert-intake {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "rpm-alert-intake-dlq", maxReceiveCount = 5 }
  }
  rpm-alert-intake-dlq { }
}
