include classpath("application.conf")

node-address { protocol = http, host = sqs, port = 9324, context-path = "" }
rest-sqs { enabled = true, bind-port = 9324, bind-hostname = "0.0.0.0", sqs-limits = strict }
aws { region = us-east-1, accountId = 000000000000 }

queues {
  rpm-clinical-events {
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "rpm-clinical-events-dlq", maxReceiveCount = 5 }
  }
  rpm-clinical-events-dlq { }
  rpm-alert-intake {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "rpm-alert-intake-dlq", maxReceiveCount = 5 }
  }
  rpm-alert-intake-dlq { }
}
