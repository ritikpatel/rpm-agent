# LOCAL DEVELOPMENT ONLY. On AWS, devices connect to IoT Core with X.509 mutual TLS.
per_listener_settings true
persistence false
max_queued_messages 20000
max_inflight_messages 100

# Plain listener for the simulator, iot-bridge and services inside the compose network.
listener 1883 0.0.0.0
allow_anonymous true

# Optional mutual-TLS listener on 8883 that mirrors IoT Core (client certificate required, per-device topic ACL).
# `edge/android/provision.sh local` writes it, with a dev CA, to .secrets/dev-pki/mosquitto (mounted here).
include_dir /mosquitto/config/conf.d
