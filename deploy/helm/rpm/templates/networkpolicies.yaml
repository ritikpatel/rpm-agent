{{- /* Zero-trust inside the namespace: every pod denies ingress unless a policy below allows the caller.
       Egress stays open (AWS APIs through NAT/endpoints, RDS, ElastiCache). Enforced by the VPC CNI network-policy
       agent (enableNetworkPolicy on the vpc-cni addon). kubectl port-forward is unaffected. */ -}}
{{- if .Values.networkPolicies.enabled }}
{{- $allow := dict
      "api"           (dict "port" 8000 "from" (list "console"))
      "model-serving" (dict "port" 8001 "from" (list "agent-service" "api"))
      "fhir"          (dict "port" 8080 "from" (list "agent-service" "fhir-loader" "model-serving"))
      "icu-gateway"   (dict "port" 2575 "from" (list "simulator")) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels: {{- include "rpm.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
{{- range $target, $rule := $allow }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ $target }}
  labels: {{- include "rpm.labels" $ | nindent 4 }}
spec:
  podSelector: { matchLabels: { app: {{ $target }} } }
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $rule.from }}
        - podSelector: { matchLabels: { app: {{ . }} } }
        {{- end }}
      ports: [{ port: {{ $rule.port }}, protocol: TCP }]
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape
  labels: {{- include "rpm.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { rpm.metrics: "true" } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicies.monitoringNamespace }} } }
      ports: [{ port: 9100, protocol: TCP }, { port: 9110, protocol: TCP }]
{{- end }}
