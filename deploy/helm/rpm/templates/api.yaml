{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {{- include "rpm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector: { matchLabels: { app: api } }
  template:
    metadata:
      labels: { app: api }
    spec:
      serviceAccountName: api
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "rpm.image" (list . "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["rpm-api"]
          env:
            {{- include "rpm.env" . | nindent 12 }}
            - { name: RPM_DEMO_CONTROLS, value: {{ .Values.config.demoControls | quote }} }
            - { name: RPM_AUTH_MODE, value: oidc }   # dev tokens are refused outside RPM_ENV=local anyway
            - { name: RPM_OIDC_ISSUER, value: {{ required "auth.issuer (Cognito) is required" .Values.auth.issuer | quote }} }
            - { name: RPM_OIDC_CLIENT_ID, value: {{ required "auth.clientId is required" .Values.auth.clientId | quote }} }
            - { name: RPM_OIDC_DOMAIN, value: {{ required "auth.domain is required" .Values.auth.domain | quote }} }
          ports: [{ name: http, containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20, failureThreshold: 3 }
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {{- include "rpm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector: { app: api }
  ports: [{ name: http, port: {{ .Values.api.service.port }}, targetPort: http }]
{{- end }}
