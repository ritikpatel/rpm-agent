{{- if .Values.simulator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
  labels: {{- include "rpm.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: simulator } }
  template:
    metadata:
      labels: { app: simulator }
    spec:
      serviceAccountName: simulator
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: simulator
          image: {{ include "rpm.image" (list . "simulator") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["rpm-sim", "run"]
          env:
            - { name: RPM_LOG_LEVEL, value: {{ .Values.config.logLevel | quote }} }
            - { name: AWS_REGION, value: {{ .Values.aws.region | quote }} }
            - { name: RPM_MIMIC_DIR, value: {{ .Values.config.mimicDir | quote }} }
            - { name: RPM_MQTT_HOST, value: {{ required "simulator.mqttHost (IoT endpoint) is required" .Values.simulator.mqttHost | quote }} }
            - { name: RPM_MQTT_PORT, value: {{ .Values.simulator.mqttPort | quote }} }
            - { name: RPM_MQTT_TLS_CA, value: /certs/ca.pem }
            - { name: RPM_MQTT_TLS_CERT, value: /certs/cert.pem }
            - { name: RPM_MQTT_TLS_KEY, value: /certs/key.pem }
            - { name: RPM_SIM_SHARDS, value: {{ .Values.simulator.shards | quote }} }
            - { name: RPM_SIM_WINDOW_S, value: {{ .Values.simulator.windowS | quote }} }
            - { name: RPM_SIM_EXCLUDE, value: {{ .Values.config.demoPatient | quote }} }
            - { name: RPM_SIM_AUTO_SCENARIOS, value: {{ .Values.simulator.autoScenariosPerHour | quote }} }
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - { name: certs, mountPath: /certs, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          resources: {{- toYaml .Values.simulator.resources | nindent 12 }}
      volumes:
        - name: certs
          secret: { secretName: {{ .Values.secrets.simMqtt }}, defaultMode: 0400 }
        - { name: tmp, emptyDir: {} }
{{- end }}
