{{- if .Values.console.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  labels: {{- include "rpm.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app: console } }
  template:
    metadata:
      labels: { app: console }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: {{ include "rpm.image" (list . "console") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env: [{ name: API_UPSTREAM, value: "api:80" }]
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 10 }
          resources: {{- toYaml .Values.console.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: console
  labels: {{- include "rpm.labels" . | nindent 4 }}
spec:
  selector: { app: console }
  ports: [{ name: http, port: 80, targetPort: http }]
{{- end }}
