# Names must match the EKS Pod Identity associations in infra/terraform/aws/iam.tf
{{- range $sa := list "stream-engine" "api" "simulator" "fhir-loader" "model-serving" "alert-service" "agent-service" "rag-index" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  labels: {{- include "rpm.labels" $ | nindent 4 }}
{{- end }}
