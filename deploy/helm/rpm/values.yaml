# Defaults target the AWS demo environment; infra/scripts/cloud-up.sh supplies registry, tag and endpoints.
image:
  registry: ""            # <account>.dkr.ecr.<region>.amazonaws.com
  tag: dev
  pullPolicy: IfNotPresent

aws:
  region: ap-southeast-2   # the project's selected Region; cloud-up.sh passes the real one

config:
  env: aws
  logLevel: INFO
  telemetryQueue: rpm-telemetry           # IoT rule -> stream-engine
  archiveQueue: rpm-telemetry-archive     # IoT rule -> telemetry-archiver -> S3 lake
  clinicalQueue: rpm-clinical-events
  alertQueue: rpm-alert-intake
  redisUrl: ""            # rediss://<elasticache-primary>:6379/0
  mimicDir: ""            # s3://<data-bucket>/mimic
  demoPatient: auto       # patient handed to the real Galaxy Watch (gw-demo-01)
  demoDevice: gw-demo-01
  embeddings: titan       # titan | hash (must match between rag-index and agent-service)
  iotEndpoint: ""         # AWS IoT Core ATS endpoint (device commands via the IoT data plane)
  demoControls: true      # presenter scenario controls in the console

auth:                     # Amazon Cognito (terraform outputs cognito_issuer / cognito_client_id / cognito_domain)
  issuer: ""
  clientId: ""
  domain: ""

secrets:
  db: rpm-db              # DATABASE_URL, JDBC_URL, DB_USER, DB_PASSWORD (created by cloud-up.sh)
  simMqtt: rpm-sim-mqtt   # ca.pem, cert.pem, key.pem for the simulator fleet certificate
  icuGatewayMqtt: rpm-icu-gw-mqtt   # ca.pem, cert.pem, key.pem for the ICU gateway thing (container mode)

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: { type: RuntimeDefault }

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }

dbMigrate:
  enabled: true
  createDatabases: hapi

streamEngine:
  enabled: true
  replicas: 1             # exactly one consumer: per-device state is read-modify-write (docs/adr/0014)
  batchLimit: 1000        # while catching up, half of each batch is held back for reordering
  receiveParallelism: 4
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }

telemetryArchiver:        # raw telemetry -> gzip NDJSON in the S3 lake (stream-engine image, second entrypoint)
  enabled: true
  bucket: ""              # terraform output lake_bucket
  flushSeconds: 60        # keep well below the archive queue's visibility timeout (300 s)
  resources:
    requests: { cpu: 25m, memory: 96Mi }
    limits: { memory: 256Mi }

api:
  enabled: true
  replicas: 1
  service: { type: ClusterIP, port: 80 }
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }

fhir:
  enabled: true
  image: hapiproject/hapi:v8.12.0-1
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 1536Mi }

fhirLoader:
  enabled: true
  workers: 3

modelServing:
  enabled: true
  registry: ""            # s3://<data-bucket>/models
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

alertService:
  enabled: true
  escalationTimeoutScale: "1.0"   # 0.2 in demos: 5-minute tiers become 1 minute
  emailBackend: ses               # ses | log
  emailSender: ""                 # verified SES identity; empty -> log backend
  smsBackend: log                 # sns | log. SMS needs AWS End User Messaging: an origination identity, and the
                                  # Paid plan in the new AWS experience (the Free plan denies it)
  consoleUrl: "http://localhost:3000"
  careTeam: |
    nurse:     {name: On-call RPM nurse,   email: nurse@example.com,     phone: "+10000000001"}
    physician: {name: On-call physician,   email: physician@example.com, phone: "+10000000002"}
    emergency: {name: Rapid response team, email: rrt@example.com,       phone: "+10000000003", webhook: ""}
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

agentService:
  enabled: true
  llmProvider: bedrock            # bedrock | anthropic | offline
  llmModel: claude-opus-5
  effortAssess: medium
  effortBrief: medium
  workers: 4
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }

ragIndex:
  enabled: true
  protocols: ""                   # s3://<data-bucket>/knowledge/protocols

console:
  enabled: true
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }

icuGateway:
  mode: container         # container (pod on EKS) | greengrass (EC2 core device) | off (monitors publish MQTT)
  thing: icu-gw-01
  hl7Endpoint: ""         # greengrass mode: <core private IP>:2575 (terraform output greengrass_core_private_ip)
  windowS: 15
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 192Mi }

simulator:
  enabled: true
  mqttHost: ""            # AWS IoT Core ATS endpoint
  mqttPort: 8883
  shards: 2
  windowS: 30
  autoScenariosPerHour: 0
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }

observability:
  enabled: false                   # true when kube-prometheus-stack runs in the cluster (cloud-up.sh OBSERVABILITY=1)
  prometheusRelease: kube-prometheus-stack

networkPolicies:
  enabled: true                    # default-deny ingress + explicit allow-list (templates/networkpolicies.yaml)
  monitoringNamespace: monitoring

auditExport:
  enabled: true
  schedule: "17 * * * *"           # hourly
  bucket: ""                       # terraform output audit_bucket (S3 Object Lock)
