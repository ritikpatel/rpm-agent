# Every check that gates a merge. Runs without AWS credentials or the (git-ignored) dataset: tests that need the
# dataset or fitted models skip; Postgres-backed tests run against a service container.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env: { POSTGRES_USER: rpm, POSTGRES_PASSWORD: rpm, POSTGRES_DB: rpm }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rpm" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run pytest -q
        env: { RPM_TEST_PG: "postgresql://rpm:rpm@localhost:5432/rpm" }
      - name: Dependency CVEs (Python)
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-workspace --all-packages > /tmp/requirements.txt
          uvx pip-audit --no-deps --disable-pip -r /tmp/requirements.txt

  console:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/console } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/console/package-lock.json }
      - run: npm ci
      - run: npm run build          # tsc --noEmit + vite build
      - run: npm audit --omit=dev --audit-level=high

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: edge/android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :shared:test :wear:assembleDebug :phone:assembleDebug

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/python.Dockerfile -t rpm/platform:ci .
      - run: docker build -f deploy/docker/console.Dockerfile -t rpm/console:ci .
      - run: docker compose -f deploy/compose/docker-compose.yml config -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secrets scan
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.66.0 fs --scanners secret --exit-code 1 \
            --skip-dirs /src/edge/android/shared/src/test/resources/pki /src
