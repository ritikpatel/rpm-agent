[project]
name = "iot-bridge"
version = "0.1.0"
description = "LOCAL ONLY: emulates the AWS IoT Core topic rule (MQTT -> enrich -> SQS) against Mosquitto + ElasticMQ"
requires-python = ">=3.12"
dependencies = ["rpm-common", "paho-mqtt>=2.1"]

[project.scripts]
iot-bridge = "iot_bridge.main:main"

[tool.uv.sources]
rpm-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
