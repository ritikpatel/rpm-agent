[project]
name = "stream-processor"
version = "0.2.0"
description = "Consumes the patient-events queue: validate, store, NEWS2, alert rules, call the risk service, raise alerts"
requires-python = ">=3.12"
dependencies = [
    "rpm-core",
]

[project.scripts]
stream-processor = "stream_processor.main:main"

[tool.uv.sources]
rpm-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
