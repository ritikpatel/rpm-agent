<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPM live board</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5d6671; --line: #e3e6ea;
    --low: #2f7d4f; --low-bg: #e6f4ea; --lm: #8a6100; --lm-bg: #fff4d6; --med: #b54708; --med-bg: #fdead7;
    --high: #b42318; --high-bg: #fde4e1; --accent: #2563eb; --flash: #eef4ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --text: #e6e9ed; --muted: #9aa4af; --line: #262c34;
      --low: #6fd49a; --low-bg: #16301f; --lm: #f3c969; --lm-bg: #33290f; --med: #f7a26a; --med-bg: #3a2212;
      --high: #ff8a80; --high-bg: #3d1614; --accent: #7aa7ff; --flash: #1c2638;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 16px 20px 8px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.on { background: var(--low); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; padding: 8px 20px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .tile .k { color: var(--muted); font-size: 12px; }
  .tile .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; padding: 8px 20px 20px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .panel h2 { font-size: 13px; font-weight: 600; margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--line);
              display: flex; justify-content: space-between; align-items: center; }
  .tabs button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px;
                 padding: 2px 8px; margin-left: 4px; cursor: pointer; font: inherit; font-size: 12px; }
  .tabs button.active { color: var(--text); border-color: var(--accent); }
  .scroll { max-height: calc(100vh - 230px); overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num { text-align: right; }
  tr.flash td { background: var(--flash); transition: background .8s; }
  .name { font-weight: 500; }
  .pid { color: var(--muted); font-size: 12px; }
  .badge { display: inline-block; min-width: 28px; text-align: center; padding: 1px 6px; border-radius: 999px;
           font-weight: 600; font-size: 12px; }
  .b-low { color: var(--low); background: var(--low-bg); }
  .b-low-medium { color: var(--lm); background: var(--lm-bg); }
  .b-medium { color: var(--med); background: var(--med-bg); }
  .b-high { color: var(--high); background: var(--high-bg); }
  .b-none { color: var(--muted); }
  .partial { color: var(--muted); font-size: 11px; margin-left: 4px; }
  .stale { color: var(--muted); }
  .ev { padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .ev .top { display: flex; justify-content: space-between; gap: 8px; }
  .ev .t { font-weight: 600; font-size: 12px; }
  .ev .s { font-size: 13px; }
  .ev .m { color: var(--muted); font-size: 12px; }
  .sev-critical, .sev-high { color: var(--high); }
  .sev-medium { color: var(--med); }
  .sev-low, .sev-info { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>RPM live board</h1>
  <span class="sub"><span id="conn" class="dot"></span><span id="connText">connecting…</span></span>
  <span class="sub">Synthetic data · ops view (clinician console ships in week 2)</span>
</header>
<section class="tiles" id="tiles"></section>
<main>
  <section class="panel">
    <h2><span>Patients <span class="pid" id="count"></span></span>
      <span class="tabs"><button data-f="all" class="active">All</button><button data-f="home">Home</button><button data-f="icu">ICU</button></span>
    </h2>
    <div class="scroll">
      <table>
        <thead><tr><th>Patient</th><th>Setting</th><th>Condition</th><th class="num">HR</th><th class="num">SpO₂</th>
          <th class="num">RR</th><th class="num">BP</th><th class="num">Temp</th><th>NEWS2</th><th>Last seen</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
  <section class="panel">
    <h2><span>Clinical events</span><span class="pid">live</span></h2>
    <div class="scroll" id="events"></div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const patients = new Map();
let filter = "all";

const fmt = (v, d = 0) => (v === null || v === undefined) ? "–" : Number(v).toFixed(d);
const val = (latest, k) => latest && latest[k] ? latest[k].v : null;
function ago(ts) {
  if (!ts) return "never";
  const s = Math.max(0, (Date.now() - new Date(ts).getTime()) / 1000);
  return s < 60 ? `${s.toFixed(0)}s ago` : s < 3600 ? `${(s / 60).toFixed(0)}m ago` : `${(s / 3600).toFixed(1)}h ago`;
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function row(p) {
  const L = p.latest || {};
  const band = p.news2_band || "none";
  const sbp = val(L, "sbp"), dbp = val(L, "dbp");
  const stale = !p.last_seen || (Date.now() - new Date(p.last_seen)) > 120000;
  return `<td><div class="name">${esc(p.display_name)}</div><div class="pid">${esc(p.patient_id)} · ${esc(p.device_id || "")}</div></td>
    <td>${p.care_setting === "icu" ? "ICU" : "Home"}</td><td>${esc(p.primary_condition)}</td>
    <td class="num">${fmt(val(L, "heart_rate"))}</td><td class="num">${fmt(val(L, "spo2"))}</td>
    <td class="num">${fmt(val(L, "resp_rate"))}</td>
    <td class="num">${sbp ? `${fmt(sbp)}/${fmt(dbp)}` : "–"}</td><td class="num">${fmt(val(L, "temp"), 1)}</td>
    <td><span class="badge b-${band}">${p.news2 ?? "–"}</span>${p.news2_partial ? '<span class="partial">partial</span>' : ""}</td>
    <td class="${stale ? "stale" : ""}">${ago(p.last_seen)}</td>`;
}

function render() {
  const list = [...patients.values()].filter(p => filter === "all" || p.care_setting === filter)
    .sort((a, b) => (b.news2 ?? -1) - (a.news2 ?? -1) || a.patient_id.localeCompare(b.patient_id));
  $("#rows").innerHTML = list.map(p => `<tr id="r-${p.patient_id}">${row(p)}</tr>`).join("");
  $("#count").textContent = `(${list.length})`;
}

function tiles(s) {
  const t = [
    ["Monitored", s.patients], ["Streaming now", s.streaming], ["NEWS2 high", s.band_high],
    ["NEWS2 medium", s.band_medium], ["Alerts, last hour", Object.entries(s.events_1h || {})
      .filter(([k]) => ["medium", "high", "critical"].includes(k)).reduce((a, [, n]) => a + n, 0)],
    ["End-to-end p50", s.e2e_p50_s == null ? "–" : `${s.e2e_p50_s.toFixed(2)} s`],
    ["End-to-end p95", s.e2e_p95_s == null ? "–" : `${s.e2e_p95_s.toFixed(2)} s`],
  ];
  $("#tiles").innerHTML = t.map(([k, v]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v ?? "–"}</div></div>`).join("");
}

function addEvent(e, prepend = true) {
  const p = patients.get(e.patient_id);
  const html = `<div class="ev"><div class="top"><span class="t sev-${e.severity}">${esc(e.type)} · ${esc(e.severity)}</span>
    <span class="m">${new Date(e.detected_at).toLocaleTimeString()}</span></div>
    <div class="s">${esc(e.summary)}</div><div class="m">${esc(p ? p.display_name : "")} · ${esc(e.patient_id)}${e.requires_alert ? " · alert" : ""}</div></div>`;
  $("#events").insertAdjacentHTML(prepend ? "afterbegin" : "beforeend", html);
  const evs = $("#events").children;
  while (evs.length > 200) evs[evs.length - 1].remove();
}

// Local ops board: signs itself in with a dev token (the API only serves this page in RPM_ENV=local dev mode).
let token = null;
async function signIn() {
  const r = await fetch("/api/auth/dev/token", { method: "POST", headers: { "content-type": "application/json" },
                                                 body: JSON.stringify({ username: "ops.board", role: "admin" }) });
  token = (await r.json()).access_token;
}
const get = (u) => fetch(u, { headers: { authorization: `Bearer ${token}` } }).then(r => r.json());

async function load() {
  if (!token) await signIn();
  const [ps, evs, st] = await Promise.all(["/api/patients", "/api/events?limit=60", "/api/stats"].map(get));
  ps.forEach(p => patients.set(p.patient_id, p));
  render(); tiles(st);
  $("#events").innerHTML = ""; evs.forEach(e => addEvent(e, false));
}

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/live`, ["rpm.v1", token]);
  ws.onopen = () => { $("#conn").classList.add("on"); $("#connText").textContent = "live"; };
  ws.onclose = () => { $("#conn").classList.remove("on"); $("#connText").textContent = "reconnecting…"; setTimeout(connect, 2000); };
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.type === "event") return addEvent(msg.event);
    const p = patients.get(msg.patient_id);
    if (!p || msg.late) return;
    p.latest = p.latest || {};
    for (const [k, v] of Object.entries(msg.vitals || {})) p.latest[k] = { v, ts: msg.ts };
    if (msg.news2) Object.assign(p, { news2: msg.news2.total, news2_band: msg.news2.band, news2_partial: msg.news2.partial });
    p.last_seen = msg.ts; p.device_id = msg.device_id;
    const tr = document.getElementById(`r-${p.patient_id}`);
    if (tr) { tr.innerHTML = row(p); tr.classList.add("flash"); setTimeout(() => tr.classList.remove("flash"), 600); }
  };
}

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("active"));
  b.classList.add("active"); filter = b.dataset.f; render();
});
setInterval(() => token && get("/api/stats").then(tiles).catch(() => {}), 5000);
setInterval(render, 15000);
load().then(connect);
</script>
</body>
</html>
