[project]
name = "agent-service"
version = "0.1.0"
description = "Clinical agents (LangGraph + Claude): assess, act within policy, write cited SBAR briefs"
requires-python = ">=3.12"
dependencies = ["rpm-alerts", "rpm-common", "rpm-contracts", "rpm-rag", "anthropic[bedrock]>=1.8",
                "langgraph>=1.2", "httpx>=0.27"]

[project.scripts]
agent-service = "agent_service.main:main"

[tool.uv.sources]
rpm-alerts = { workspace = true }
rpm-common = { workspace = true }
rpm-contracts = { workspace = true }
rpm-rag = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
