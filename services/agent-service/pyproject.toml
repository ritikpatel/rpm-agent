[project]
name = "agent-service"
version = "0.2.0"
description = "Clinical agents on Amazon Bedrock (LangGraph): monitoring, risk, escalation, summary"
requires-python = ">=3.12"
dependencies = [
    "rpm-core",
    "langgraph>=1.2",
    "httpx>=0.27",
]

[project.scripts]
agent-service = "agent_service.main:main"

[tool.uv.sources]
rpm-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
