[project]
name = "rpm-icu-gateway"
version = "0.3.0"
description = "ICU bedside gateway: HL7 v2 (MLLP) from monitors, bedside NEWS2 + alarms, store-and-forward uplink to AWS IoT (Greengrass component or plain container)"
requires-python = ">=3.12"
# Deliberately small: this runs on an edge box. No database drivers or AWS SDK; Greengrass IPC is optional.
dependencies = ["rpm-contracts", "rpm-features", "paho-mqtt>=2.1", "prometheus-client>=0.20", "pydantic-settings>=2.4"]

[project.optional-dependencies]
greengrass = ["awsiotsdk>=1.22"]

[project.scripts]
rpm-icu-gateway = "rpm_icu_gateway.cli:main"

[tool.uv.sources]
rpm-contracts = { workspace = true }
rpm-features = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
