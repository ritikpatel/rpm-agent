[project]
name = "rpm-common"
version = "0.1.0"
description = "Shared runtime plumbing: settings, logging, Postgres (+migrations), Redis, AWS clients, metrics"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.0",
    "boto3>=1.35",
    "prometheus-client>=0.20",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
