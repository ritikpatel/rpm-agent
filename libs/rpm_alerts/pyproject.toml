[project]
name = "rpm-alerts"
version = "0.1.0"
description = "Alert lifecycle, escalation policy and notification channels (shared by alert-service and api)"
requires-python = ">=3.12"
dependencies = ["rpm-contracts", "rpm-common", "pyyaml>=6.0", "httpx>=0.27"]

[tool.uv.sources]
rpm-contracts = { workspace = true }
rpm-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
