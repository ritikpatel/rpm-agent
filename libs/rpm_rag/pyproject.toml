[project]
name = "rpm-rag"
version = "0.1.0"
description = "Clinical RAG: protocol corpus + synthetic discharge summaries, embeddings, hybrid pgvector/FTS retrieval"
requires-python = ">=3.12"
dependencies = ["rpm-common", "rpm-mimic", "httpx>=0.27"]

[project.scripts]
rpm-rag = "rpm_rag.cli:main"

[tool.uv.sources]
rpm-common = { workspace = true }
rpm-mimic = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
