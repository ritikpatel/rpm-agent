[project]
name = "rpm-core"
version = "0.2.0"
description = "Shared code: device contracts, NEWS2 and alert rules, settings, Postgres + migrations, SQS reader, RAG index, dataset reader"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "boto3>=1.35",
    "prometheus-client>=0.20",
    "paho-mqtt>=2.1",
    "httpx>=0.27",
]

[project.scripts]
rpm-migrate = "rpm_core.migrate:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
