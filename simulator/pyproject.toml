[project]
name = "rpm-simulator"
version = "0.2.0"
description = "Simulated wearables and ICU monitors: ICU replay, post-discharge physiology, deterioration scenarios"
requires-python = ">=3.12"
dependencies = [
    "rpm-core",
]

[project.scripts]
rpm-sim = "rpm_simulator.cli:main"

[tool.uv.sources]
rpm-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
