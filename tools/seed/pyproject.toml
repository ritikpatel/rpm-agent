[project]
name = "rpm-seed"
version = "0.2.0"
description = "Loads the cohort into FHIR, registers devices, builds the guideline index"
requires-python = ">=3.12"
dependencies = [
    "rpm-core",
    "httpx>=0.27",
]

[project.scripts]
rpm-seed = "rpm_seed.cli:main"

[tool.uv.sources]
rpm-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
